# NVDA 서사 — 카드의 [사실] 위에 쓰는 [해석]
# 숫자는 카드에 있는 값만 인용한다. 새 숫자를 만들지 않는다.
ticker: NVDA
updated: 2026-08-24
author: claude

one_liner: >-
  엔비디아는 AI 모델을 학습시키고 돌리는 데 쓰는 계산 장치를 파는 회사입니다.
  예전엔 게임용 그래픽카드 회사였는데, 지금은 매출의 90%가 데이터센터에서 나옵니다.
  전 세계 AI 회사들이 모델을 만들려면 이 회사 장비를 사야 하는 구조입니다.

how_it_makes_money: >-
  매출을 부문으로 나누면 Compute & Networking 이 89.6%, Graphics 가 10.4% 입니다.
  그런데 영업이익률이 각각 67.3% 와 40.8% 로 벌어져 있어서, 이익 기여는 컴퓨트 쪽으로
  더 쏠립니다. 제품별로 보면 Data Center 가 47.3% 이고 그 안에서 Compute 39.6% ·
  Networking 7.7% 로 다시 갈립니다. 게이밍은 3.9% 로 이제 곁가지입니다.
  요약하면 "AI 데이터센터 한 곳에 매출과 이익이 동시에 집중된" 구조입니다.
  집중도가 높다는 건 잘 될 때 크게 벌고 꺾일 때 크게 빠진다는 뜻이기도 합니다.

story: >-
  FCF 로 보면 지난 4년이 한눈에 들어옵니다. FY2022 8.1B → FY2023 3.8B 로 반토막 났다가
  FY2024 27.0B → FY2025 60.9B → FY2026 96.7B 로 급증했습니다. FY2023 의 저점은
  암호화폐 채굴 수요가 꺼지고 재고가 쌓였던 시기이고, 그 뒤 상승은 생성형 AI 수요입니다.
  다만 공시 문구를 보면 FY2026 10-K 에 litigation 과 impairment 가 새로 등장했습니다.
  급성장 국면에서 새로 붙은 위험 어휘라 맥락을 원문에서 확인할 필요가 있습니다.
  가격 쪽은 더 분명합니다 — 시장은 향후 10년 연 25.4% FCF 성장을 요구하고 있는데,
  이건 "지금까지 하던 대로"가 아니라 "고성장을 10년 더"에 가까운 눈높이입니다.

risks:
  - title: AI 자본지출 사이클이 꺾이는 것
    detail: >-
      매출의 절반 가까이가 Data Center 한 곳에서 나오고 영업이익률도 가장 높습니다.
      고객사(하이퍼스케일러)가 투자 속도를 늦추면 매출과 이익이 동시에 빠집니다.
      FY2023 에 FCF 가 8.1B → 3.8B 로 반토막 났던 전례가 있습니다.
    evidence: 세그먼트 표(FY2026 R82) · FCF 계열 FY2022~FY2026
  - title: 고객이 곧 경쟁자가 되는 구조
    detail: >-
      주요 고객사들이 자체 칩을 설계하고 있습니다. 지금은 엔비디아를 사야 하지만,
      대안이 성립하면 가격 결정력이 가장 먼저 흔들립니다. 영업이익률 67%가
      그만큼 방어해야 할 폭이 크다는 뜻이기도 합니다.
    evidence: 10-K Item 1A · 세그먼트 영업이익률 67.3%
  - title: 눈높이 자체가 위험
    detail: >-
      현재가는 연 25.4% 성장을 10년간 요구합니다. 성장이 15%로 낮아지기만 해도
      산술적으로 정당화되는 주가는 크게 내려갑니다. 회사가 못해서가 아니라
      "덜 잘해도" 가격이 흔들리는 구간입니다.
    evidence: 역DCF (WACC 9.19%, 영구성장 2.5%) · 성장률 가정별 산술 표

watch_next:
  - FY2026 10-K 에 새로 등장한 litigation·impairment 의 원문 맥락 (Item 1A·7A)
  - 기준 FCF 를 최신(96.7B)으로 볼지 3년 평균(61.5B)으로 볼지 — 요구 성장률이 19.2% 와 25.4% 로 갈린다
  - 다음 실적(확정 2026-08-26 마감후) 이후 데이터센터 매출 비중 변화
